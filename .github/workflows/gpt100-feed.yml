name: GPT100 feed
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gpt100-feed
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tracker feed
        run: python3 gpt100/fetch_feed.py
      - name: Commit feed
        run: |
          git config user.name "gpt100-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gpt100/feed.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "gpt100 feed $(date -u +%H:%M)"
          git pull --rebase origin main
          git push
